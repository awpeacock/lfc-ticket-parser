name: LFC Ticket Parser Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - Dev
          - Test
          - Production

jobs:
  validate:
    name: Validate sourcecode
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          ENVIRONMENT: Test

          DOMAIN: https://www.liverpoolfc.com
          INDEX_URL: /tickets?category=mens
          HTML_FORMAT: 2026

          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT }}
          EMAIL_SECURE: ${{ vars.EMAIL_SECURE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_ERROR: ${{ secrets.EMAIL_ERROR }}

          DB_CLIENT: DynamoDB
          DB_TABLE: LFCT-Sales
          DB_BACKUP: LFCT-Backup

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy stack
        run: npm run deploy
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}

          DOMAIN: ${{ vars.DOMAIN }}
          INDEX_URL: ${{ vars.INDEX_URL }}
          HTML_FORMAT: ${{ vars.HTML_FORMAT }}

          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ vars.EMAIL_PORT }}
          EMAIL_SECURE: ${{ vars.EMAIL_SECURE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_ERROR: ${{ secrets.EMAIL_ERROR }}

          DB_CLIENT: ${{ vars.DB_CLIENT }}
          DB_TABLE: ${{ vars.DB_TABLE }}
          DB_BACKUP: ${{ vars.DB_BACKUP }}
